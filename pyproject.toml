[project]
name = "frontier-cascadia"
version = "0.1.0"
description = "Threshold: local-first CSI entrance-motion prototype"
requires-python = ">=3.10"
dependencies = [
    "daytona",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pyserial>=3.5,<4",
    "numpy>=2,<3",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
